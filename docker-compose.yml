# 컨테이너 로그가 디스크를 채우지 않게 크기를 제한한다. 적용은 컨테이너를 새로 만들 때(app은 배포 때,
# nginx·postgres는 수동 재생성 때)다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - portfolio-net
    logging: *default-logging

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: portfolio
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/portfolio
    volumes:
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads
    expose:
      - "3000"
    # 응답 없이 떠 있는 상태를 `docker ps`에서 볼 수 있게 한다(재시작은 하지 않는다). 컨테이너 안에서 직접 확인한다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - portfolio-net

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./public/uploads:/usr/share/nginx/uploads:ro
      - /home/ubuntu/nihongo/dist:/usr/share/nginx/nihongo:ro
    depends_on:
      - app
    networks:
      - portfolio-net
      - contalk-net
    logging: *default-logging

volumes:
  pgdata:
    external: true
    name: blog-storage-postgres_pgdata

networks:
  portfolio-net:
    driver: bridge
  # 계약똑똑 스택(/home/ubuntu/contalk)이 만드는 네트워크.
  # contalk.co.kr 요청을 contalktok_frontend 로 넘기려면 붙어 있어야 한다.
  contalk-net:
    external: true
    name: contalk_default
