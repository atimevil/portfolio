# 공개·관리자 API 호출 제한(IP당). 관리자 일괄 작업과 조회수 집계가 정상으로 쓰는 양보다 넉넉하게 잡았다.
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=10r/s;

# HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name foxibu.is-a.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name foxibu.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/foxibu.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxibu.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    # 포트폴리오 앱 주소를 요청 때마다 Docker DNS로 다시 찾는다. proxy_pass에 이름을 바로 쓰면 nginx가
    # 시작할 때 IP를 한 번만 정해서, app 컨테이너가 재시작해 IP가 바뀌면 옛 IP로 보낸다
    # (2026-10-12: 사이트가 404·다른 프로젝트 화면을 냈고 nginx reload로 복구). 계약똑똑 블록과 같은 방식.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio_app app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Supabase Realtime (WebSocket 필요) ──────────────────
    location /realtime/v1 {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Supabase API (REST / Auth / Storage) ────────────────
    location ~ ^/(rest|auth|storage|functions)/v1 {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OnlineGo 소문자 경로 → 정식 경로(/onlineGo)로 리다이렉트 ──
    # basePath가 대문자 G라 /onlinego로 치면 안 맞는다. 흔한 오타를 구제.
    location ~ ^/onlinego(/.*)?$ {
        return 308 /onlineGo$1;
    }

    # ── OnlineGo 정적 애셋 ───────────────────────────────────
    location /onlineGo/_next/static/ {
        proxy_pass http://onlinego-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── OnlineGo 앱 ──────────────────────────────────────────
    location /onlineGo {
        proxy_pass http://onlinego-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Nihongo (일본어 학습 대시보드, 정적 사이트) ───────────
    location = /nihongo {
        return 301 /nihongo/;
    }

    location /nihongo/ {
        alias /usr/share/nginx/nihongo/;
        try_files $uri $uri/ /nihongo/index.html;
    }

    location /nihongo/assets/ {
        alias /usr/share/nginx/nihongo/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── AI_TOP_100 카카오톡 봇 웹훅 (atimevil/aitop100-agent) ──
    # 봇 컨테이너가 꺼져 있어도 nginx가 뜨도록 변수로 넘긴다 (위 $portfolio_app과 같은 방식).
    location /aitop/ {
        set $aitop_bot aitop100-bot;
        proxy_pass http://$aitop_bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 포트폴리오 정적 애셋 ─────────────────────────────────
    # add_header를 쓴 location은 앱이 붙이는 보안 헤더를 받지 못하니 nosniff는 여기서 직접 붙인다.
    location /_next/static/ {
        proxy_pass http://$portfolio_app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── 포트폴리오 API (호출 제한) ───────────────────────────
    # 초과 요청은 503 대신 429로 돌려준다. 업로드·PDF 변환이 길어질 수 있어 읽기 제한 시간을 늘렸다.
    location ^~ /api/ {
        limit_req zone=portfolio_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://$portfolio_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── 포트폴리오 앱 (기본) ─────────────────────────────────
    location / {
        proxy_pass http://$portfolio_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 계약똑똑 (contalk.co.kr) — 별도 도메인. 80/443 은 이 서버에서 이 nginx 만
# 잡고 있으므로 여기서 받아 계약똑똑 스택(contalktok_frontend)으로 넘긴다.
# contalk 스택은 자체 네트워크(contalk_default)에 있어 아래 external network
# 연결이 필요하다 — docker-compose.yml 의 nginx 서비스 networks 참고.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name contalk.co.kr www.contalk.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://contalk.co.kr$request_uri;
    }
}

# www → 루트로 정리 (인증서에 두 이름이 모두 들어 있다)
server {
    listen 443 ssl;
    http2 on;
    server_name www.contalk.co.kr;

    ssl_certificate     /etc/letsencrypt/live/contalk.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contalk.co.kr/privkey.pem;

    return 301 https://contalk.co.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name contalk.co.kr;

    ssl_certificate     /etc/letsencrypt/live/contalk.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contalk.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 계약서 업로드 — 백엔드 상한(20MB)과 맞춘다.
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 컨테이너 재생성으로 IP 가 바뀌어도 따라가도록 매번 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 프로덕션: Vite 개발 서버가 아니라 정적 번들을 서빙하는 nginx 로 넘긴다.
    set $contalk_web contalktok_web;

    location / {
        proxy_pass http://$contalk_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # 계약서 분석은 오래 걸린다.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
