# HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name foxibu.is-a.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name foxibu.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/foxibu.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxibu.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Supabase Realtime (WebSocket 필요) ──────────────────
    location /realtime/v1 {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Supabase API (REST / Auth / Storage) ────────────────
    location ~ ^/(rest|auth|storage|functions)/v1 {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OnlineGo 소문자 경로 → 정식 경로(/onlineGo)로 리다이렉트 ──
    # basePath가 대문자 G라 /onlinego로 치면 안 맞는다. 흔한 오타를 구제.
    location ~ ^/onlinego(/.*)?$ {
        return 308 /onlineGo$1;
    }

    # ── OnlineGo 정적 애셋 ───────────────────────────────────
    location /onlineGo/_next/static/ {
        proxy_pass http://onlinego-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── OnlineGo 앱 ──────────────────────────────────────────
    location /onlineGo {
        proxy_pass http://onlinego-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── 포트폴리오 정적 애셋 ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 포트폴리오 앱 (기본) ─────────────────────────────────
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 계약똑똑 (contalk.co.kr) — 별도 도메인. 80/443 은 이 서버에서 이 nginx 만
# 잡고 있으므로 여기서 받아 계약똑똑 스택(contalktok_frontend)으로 넘긴다.
# contalk 스택은 자체 네트워크(contalk_default)에 있어 아래 external network
# 연결이 필요하다 — docker-compose.yml 의 nginx 서비스 networks 참고.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name contalk.co.kr www.contalk.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://contalk.co.kr$request_uri;
    }
}

# www → 루트로 정리 (인증서에 두 이름이 모두 들어 있다)
server {
    listen 443 ssl;
    http2 on;
    server_name www.contalk.co.kr;

    ssl_certificate     /etc/letsencrypt/live/contalk.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contalk.co.kr/privkey.pem;

    return 301 https://contalk.co.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name contalk.co.kr;

    ssl_certificate     /etc/letsencrypt/live/contalk.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contalk.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 계약서 업로드 — 백엔드 상한(20MB)과 맞춘다.
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 컨테이너 재생성으로 IP 가 바뀌어도 따라가도록 매번 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $contalk_frontend contalktok_frontend;

    location / {
        proxy_pass http://$contalk_frontend:3000;
        proxy_http_version 1.1;
        # Vite HMR 이 WebSocket 을 쓴다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # 계약서 분석은 오래 걸린다.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
