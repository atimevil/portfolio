<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="ChosunInsight 하이브리드 RAG 파이프라인: 질문을 의도에 따라 정형 답변, 벡터+BM25 하이브리드 검색, 공식 도메인 실시간 검색 세 갈래로 라우팅하고 답변을 생성한다">
  <style>
    /* 페이지가 아니라 이 그림 자체가 테마를 따른다 (img로 불러도 동작).
       사이트의 수동 다크 토글까지는 못 따라가므로 OS 설정 기준이다. */

    
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
    .t { fill: var(--ink); font: 600 13px 'Helvetica Neue', Arial, sans-serif; }
    .s { fill: var(--ink-dim); font: 400 11px 'Helvetica Neue', Arial, sans-serif; }
    .lbl { fill: var(--accent); font: 600 10px 'Helvetica Neue', Arial, sans-serif; letter-spacing: .08em; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- 질문 -->
  <rect class="box" x="8" y="126" width="112" height="48" rx="8" />
  <text class="t" x="64" y="147" text-anchor="middle">질문</text>
  <text class="s" x="64" y="163" text-anchor="middle">학사 문의</text>

  <!-- 라우터 -->
  <path class="arrow" d="M120 150 H168" marker-end="url(#a)" />
  <rect class="box-accent" x="172" y="120" width="128" height="60" rx="8" />
  <text class="lbl" x="236" y="140" text-anchor="middle">ROUTER</text>
  <text class="t" x="236" y="158" text-anchor="middle">의도 분류</text>
  <text class="s" x="236" y="172" text-anchor="middle">3-way</text>

  <!-- 분기 -->
  <path class="arrow" d="M300 150 H328 V48 H352" marker-end="url(#a)" />
  <path class="arrow" d="M300 150 H352" marker-end="url(#a)" />
  <path class="arrow" d="M300 150 H328 V252 H352" marker-end="url(#a)" />

  <!-- 1. 정형 -->
  <rect class="box" x="356" y="24" width="196" height="48" rx="8" />
  <text class="t" x="372" y="45">정형 답변</text>
  <text class="s" x="372" y="61">규칙 기반 · 학사일정 등</text>

  <!-- 2. 하이브리드 검색 -->
  <rect class="box" x="356" y="108" width="196" height="84" rx="8" />
  <text class="t" x="372" y="130">하이브리드 검색</text>
  <rect class="box" x="372" y="141" width="76" height="24" rx="5" />
  <text class="s" x="410" y="157" text-anchor="middle">ChromaDB</text>
  <rect class="box" x="456" y="141" width="76" height="24" rx="5" />
  <text class="s" x="494" y="157" text-anchor="middle">BM25</text>
  <text class="s" x="372" y="182">밀집 + 희소 → RRF 결합</text>

  <!-- 3. 실시간 -->
  <rect class="box" x="356" y="228" width="196" height="48" rx="8" />
  <text class="t" x="372" y="249">공식 도메인 실시간</text>
  <text class="s" x="372" y="265">별도 경로 · 최신성 보장</text>

  <!-- 합류 -->
  <path class="arrow" d="M552 48 H592 V150 H620" marker-end="url(#a)" />
  <path class="arrow" d="M552 150 H620" marker-end="url(#a)" />
  <path class="arrow" d="M552 252 H592 V150 H620" marker-end="url(#a)" />

  <!-- 답변 -->
  <rect class="box-accent" x="624" y="120" width="128" height="60" rx="8" />
  <text class="lbl" x="688" y="140" text-anchor="middle">LLM</text>
  <text class="t" x="688" y="158" text-anchor="middle">답변 생성</text>
  <text class="s" x="688" y="172" text-anchor="middle">근거 문서 포함</text>

  <path class="arrow" d="M752 150 H800" marker-end="url(#a)" />
  <rect class="box" x="804" y="126" width="68" height="48" rx="8" />
  <text class="t" x="838" y="154" text-anchor="middle">응답</text>
</svg>
