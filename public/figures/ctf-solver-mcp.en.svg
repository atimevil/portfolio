<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="CTF-Solver architecture: an LLM connects over MCP to a FastMCP server that calls more than 55 Kali security tools. The original server could only run one command at a time; this one loops through running a tool, reading its output, and picking the next tool.">
  <style>

    
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
    .box-past { fill: var(--past); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; }
    .t { fill: var(--ink); font: 600 13px 'Helvetica Neue', Arial, sans-serif; }
    .s { fill: var(--ink-dim); font: 400 11px 'Helvetica Neue', Arial, sans-serif; }
    .lbl { fill: var(--accent); font: 600 10px 'Helvetica Neue', Arial, sans-serif; letter-spacing: .08em; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .arrow-accent { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--line)" />
    </marker>
    <marker id="ab" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M8 0 L0 4 L8 8 z" fill="var(--line)" />
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- ── 상단: 구조 ── -->
  <rect class="box" x="16" y="40" width="168" height="64" rx="8" />
  <text class="t" x="100" y="68" text-anchor="middle">LLM</text>
  <text class="s" x="100" y="85" text-anchor="middle">MCP client</text>

  <path class="arrow" d="M192 72 H240" marker-end="url(#a)" marker-start="url(#ab)" />
  <text class="lbl" x="216" y="62" text-anchor="middle">MCP</text>

  <rect class="box-accent" x="248" y="30" width="212" height="84" rx="8" />
  <text class="t" x="354" y="60" text-anchor="middle">CTF-Solver server</text>
  <text class="s" x="354" y="78" text-anchor="middle">FastMCP · Flask</text>
  <text class="s" x="354" y="94" text-anchor="middle">Docker</text>

  <path class="arrow" d="M468 72 H516" marker-end="url(#a)" />

  <rect class="box" x="524" y="40" width="200" height="64" rx="8" />
  <text class="t" x="624" y="68" text-anchor="middle">Kali security tools</text>
  <text class="s" x="624" y="85" text-anchor="middle">~10 before → 55+ now</text>

  <!-- ── 구분선 ── -->
  <line class="rule" x1="16" y1="146" x2="864" y2="146" />

  <!-- ── 하단: 멀티스텝 루프 ── -->
  <text class="lbl" x="16" y="176">MULTI-STEP</text>
  <text class="t" x="16" y="196">Multi-step workflow</text>

  <rect class="box-past" x="184" y="168" width="176" height="36" rx="6" />
  <text class="s" x="272" y="191" text-anchor="middle">Original: one-shot runs only</text>

  <rect class="box" x="16" y="232" width="150" height="52" rx="8" />
  <text class="t" x="91" y="255" text-anchor="middle">Run tool</text>
  <text class="s" x="91" y="271" text-anchor="middle">① </text>

  <path class="arrow-accent" d="M174 258 H206" marker-end="url(#aa)" />

  <rect class="box" x="214" y="232" width="150" height="52" rx="8" />
  <text class="t" x="289" y="255" text-anchor="middle">Read output</text>
  <text class="s" x="289" y="271" text-anchor="middle">②</text>

  <path class="arrow-accent" d="M372 258 H404" marker-end="url(#aa)" />

  <rect class="box" x="412" y="232" width="164" height="52" rx="8" />
  <text class="t" x="494" y="255" text-anchor="middle">Pick next tool</text>
  <text class="s" x="494" y="271" text-anchor="middle">③</text>

  <path class="arrow-accent" d="M584 258 H616" marker-end="url(#aa)" />

  <rect class="box-accent" x="624" y="232" width="150" height="52" rx="8" />
  <text class="t" x="699" y="263" text-anchor="middle">Flag</text>

  <!-- 반복 화살표 -->
  <path class="arrow-accent" d="M494 284 V310 H91 V292" marker-end="url(#aa)" />
  <text class="lbl" x="300" y="324" text-anchor="middle">repeat</text>
</svg>
