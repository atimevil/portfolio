<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="딥보이스 탐지 Flask 모델 서버. 처음에는 큐와 워커 스레드로 접수만 하고 결과를 돌려주지 못했고, 전역 Lock으로 요청을 하나씩 처리해 점수와 받아쓰기를 응답으로 돌려주게 바꿨다.">
  <style>

    
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .acc{fill:var(--soft);stroke:var(--accent);stroke-width:1}
    .bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1}
    .good{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1}
    .t{fill:var(--ink);font:600 13px 'Helvetica Neue',Arial,sans-serif}
    .s{fill:var(--dim);font:400 11px 'Helvetica Neue',Arial,sans-serif}
    .c{fill:var(--faint);font:400 10px 'Helvetica Neue',Arial,sans-serif}
    .lb{fill:var(--accent);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .lw{fill:var(--warn);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .lo{fill:var(--ok);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .ar{stroke:var(--line);stroke-width:1.5;fill:none}
    .rule{stroke:var(--line);stroke-width:1}
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker></defs>
  <text class="t" x="16" y="24">Flask 모델 서버 — 겹치는 요청 처리 방식 바꾸기</text>
  <line class="rule" x1="16" y1="40" x2="864" y2="40"/>

  <text class="lw" x="16" y="66">1차 · 큐 + 워커 스레드</text>
  <rect class="box" x="16" y="78" width="110" height="44" rx="7"/>
  <text class="s" x="71" y="105" text-anchor="middle">음성 업로드</text>
  <path class="ar" d="M126 100 H160" marker-end="url(#a)"/>
  <rect class="box" x="164" y="78" width="150" height="44" rx="7"/>
  <text class="s" x="239" y="105" text-anchor="middle">Flask /analyze</text>
  <path class="ar" d="M314 100 H348" marker-end="url(#a)"/>
  <rect class="bad" x="352" y="78" width="190" height="44" rx="7"/>
  <text class="t" x="447" y="99" text-anchor="middle">대기열에 넣고 바로 응답</text>
  <text class="s" x="447" y="114" text-anchor="middle">결과는 응답에 못 실음</text>
  <text class="c" x="560" y="105">프론트가 판정 결과를 받지 못한다</text>

  <line class="rule" x1="16" y1="150" x2="864" y2="150"/>

  <text class="lo" x="16" y="176">최종 · Lock 순차 처리</text>
  <rect class="box" x="16" y="188" width="110" height="44" rx="7"/>
  <text class="s" x="71" y="215" text-anchor="middle">음성 업로드</text>
  <path class="ar" d="M126 210 H160" marker-end="url(#a)"/>
  <rect class="box" x="164" y="188" width="150" height="44" rx="7"/>
  <text class="s" x="239" y="215" text-anchor="middle">Flask /analyze · 파일 검사</text>
  <path class="ar" d="M314 210 H348" marker-end="url(#a)"/>
  <rect class="good" x="352" y="188" width="190" height="44" rx="7"/>
  <text class="t" x="447" y="209" text-anchor="middle">전역 Lock</text>
  <text class="s" x="447" y="224" text-anchor="middle">한 번에 하나씩 추론</text>
  <path class="ar" d="M542 210 H576" marker-end="url(#a)"/>
  <rect class="box" x="580" y="188" width="190" height="44" rx="7"/>
  <text class="s" x="675" y="215" text-anchor="middle">합성 점수 + 받아쓰기 응답</text>

  <text class="c" x="16" y="277">본인: Flask 서버 · 팀원: 탐지 모델(ReDimNet)·프론트(React)</text>
</svg>
