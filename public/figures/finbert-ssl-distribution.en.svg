<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-label="Pseudo-label sentiment distributions compared. The source financial domain is 12.5% negative, 59.4% neutral, 28.1% positive. Seven cycles at threshold 0.75 give 12% / 58% / 30%, almost the same as the source. Three cycles at threshold 0.9 give 31% / 47% / 22%, drifting away from the source distribution.">
  <style>

    
    .title { fill: var(--ink); font: 600 14px 'Helvetica Neue', Arial, sans-serif; }
    .sub   { fill: var(--ink-dim); font: 400 11px 'Helvetica Neue', Arial, sans-serif; }
    .cap   { fill: var(--ink-faint); font: 400 10px 'Helvetica Neue', Arial, sans-serif; }
    .rowt  { fill: var(--ink); font: 600 12px 'Helvetica Neue', Arial, sans-serif; }
    .rows  { fill: var(--ink-dim); font: 400 10px 'Helvetica Neue', Arial, sans-serif; }
    .val   { font: 700 11px 'Helvetica Neue', Arial, sans-serif; }
    .seg   { stroke: var(--mark-ring); stroke-width: 2; }
    .rule  { stroke: var(--line); stroke-width: 1; }
  </style>

  <text class="title" x="16" y="24">Pseudo-label sentiment: does the threshold keep the source distribution?</text>
  <text class="sub" x="16" y="43">The lower the confidence threshold α, the closer it stays to the original financial distribution</text>

  <!-- 범례 -->
  <rect x="660" y="14" width="10" height="10" rx="2" fill="var(--neg)" />
  <text class="sub" x="676" y="23">Negative</text>
  <rect x="738" y="14" width="10" height="10" rx="2" fill="var(--neu)" />
  <text class="sub" x="754" y="23">Neutral</text>
  <rect x="806" y="14" width="10" height="10" rx="2" fill="var(--pos)" />
  <text class="sub" x="822" y="23">Positive</text>

  <line class="rule" x1="16" y1="58" x2="864" y2="58" />

  <!-- ── 행 1: 원본 금융 도메인 (기준선) ── -->
  <text class="rowt" x="16" y="86">Source (financial)</text>
  <text class="rows" x="16" y="101">Financial PhraseBank test, 4,846</text>
  <rect class="seg" x="256" y="76" width="72.8" height="26" rx="3" fill="var(--neg)" />
  <text class="val" x="292" y="93" text-anchor="middle" fill="var(--on-neg)">12.5</text>
  <rect class="seg" x="330.8" y="76" width="354.5" height="26" rx="3" fill="var(--neu)" />
  <text class="val" x="508" y="93" text-anchor="middle" fill="var(--on-neu)">59.4</text>
  <rect class="seg" x="687.3" y="76" width="166.8" height="26" rx="3" fill="var(--pos)" />
  <text class="val" x="770" y="93" text-anchor="middle" fill="var(--on-pos)">28.1</text>

  <!-- ── 행 2: α=0.75 ── -->
  <text class="rowt" x="16" y="142">α = 0.75 · 7 cycles</text>
  <text class="rows" x="16" y="157">Nearly matches the source</text>
  <rect class="seg" x="256" y="132" width="70" height="26" rx="3" fill="var(--neg)" />
  <text class="val" x="291" y="149" text-anchor="middle" fill="var(--on-neg)">12</text>
  <rect class="seg" x="328" y="132" width="346" height="26" rx="3" fill="var(--neu)" />
  <text class="val" x="501" y="149" text-anchor="middle" fill="var(--on-neu)">58</text>
  <rect class="seg" x="676" y="132" width="178" height="26" rx="3" fill="var(--pos)" />
  <text class="val" x="765" y="149" text-anchor="middle" fill="var(--on-pos)">30</text>

  <!-- ── 행 3: α=0.9 ── -->
  <text class="rowt" x="16" y="198">α = 0.9 · 3 cycles</text>
  <text class="rows" x="16" y="213">Negatives triple; drifts from the source</text>
  <rect class="seg" x="256" y="188" width="184" height="26" rx="3" fill="var(--neg)" />
  <text class="val" x="348" y="205" text-anchor="middle" fill="var(--on-neg)">31</text>
  <rect class="seg" x="442" y="188" width="280" height="26" rx="3" fill="var(--neu)" />
  <text class="val" x="582" y="205" text-anchor="middle" fill="var(--on-neu)">47</text>
  <rect class="seg" x="724" y="188" width="130" height="26" rx="3" fill="var(--pos)" />
  <text class="val" x="789" y="205" text-anchor="middle" fill="var(--on-pos)">22</text>

  <line class="rule" x1="16" y1="240" x2="864" y2="240" />

  <text class="sub" x="16" y="262">At α = 0.75: Macro F1 0.85 / 0.84 → 0.87, Macro Accuracy 0.86 → 0.88</text>
  <text class="cap" x="16" y="284">Values in %. Rounded, so a row may not sum to 100.</text>
  <text class="cap" x="16" y="300">Source: unpublished follow-up, not the KCC 2026 paper. Evaluating the Model Stability of FinBERT through SSL under Cross-Domain Mismatch, Team C</text>
</svg>
