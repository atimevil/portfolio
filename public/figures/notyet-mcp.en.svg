<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Not-Yet combined Kali Linux penetration-testing tools and Perplexity AI search into a single MCP server. It was later extended into CTF-Solver.">
  <style>

    
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .acc{fill:var(--soft);stroke:var(--accent);stroke-width:1}
    .dash{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
    .t{fill:var(--ink);font:600 13px "Helvetica Neue",Arial,sans-serif}
    .s{fill:var(--dim);font:400 11px "Helvetica Neue",Arial,sans-serif}
    .c{fill:var(--faint);font:400 10px "Helvetica Neue",Arial,sans-serif}
    .lb{fill:var(--accent);font:600 10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
    .ar{stroke:var(--line);stroke-width:1.5;fill:none}
    .rule{stroke:var(--line);stroke-width:1}
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker></defs>
  <text class="t" x="16" y="24">Two paths in one MCP server: running tools and searching together</text>
  <line class="rule" x1="16" y1="40" x2="864" y2="40"/>

  <rect class="box" x="16" y="66" width="184" height="50" rx="8"/>
  <text class="t" x="32" y="88">Kali pentest tools</text>
  <text class="s" x="32" y="105">Scan · analyze · exploit</text>

  <rect class="box" x="16" y="134" width="184" height="50" rx="8"/>
  <text class="t" x="32" y="156">Perplexity AI search</text>
  <text class="s" x="32" y="173">Vulnerabilities · public info</text>

  <path class="ar" d="M200 91 H248 V118 H286" marker-end="url(#a)"/>
  <path class="ar" d="M200 159 H248 V132 H286" marker-end="url(#a)"/>

  <rect class="acc" x="290" y="95" width="196" height="60" rx="8"/>
  <text class="lb" x="388" y="118" text-anchor="middle">MCP SERVER</text>
  <text class="t" x="388" y="138" text-anchor="middle">Not-Yet</text>
  <text class="s" x="388" y="152" text-anchor="middle">Python · Flask</text>

  <path class="ar" d="M486 125 H534" marker-end="url(#a)"/>
  <rect class="box" x="538" y="100" width="130" height="50" rx="8"/>
  <text class="t" x="603" y="130" text-anchor="middle">LLM</text>

  <path class="dash" d="M388 155 V196 H744 V150"/>
  <rect class="box" x="672" y="100" width="176" height="50" rx="8"/>
  <text class="s" x="760" y="122" text-anchor="middle">Extended after the demo</text>
  <text class="t" x="760" y="140" text-anchor="middle">→ CTF-Solver</text>

  <text class="c" x="16" y="222">Whitehat School cohort 3 final project · developer on the team · 2025.07</text>
</svg>
