<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="PALLOW architecture: a Java Spring main server handles client requests and hands friend recommendations to a separate Flask server that uses cosine similarity. Both are deployed to Oracle Cloud with Docker.">
  <style>

    
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .acc{fill:var(--soft);stroke:var(--accent);stroke-width:1}
    .bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1}
    .good{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1}
    .t{fill:var(--ink);font:600 13px 'Helvetica Neue',Arial,sans-serif}
    .s{fill:var(--dim);font:400 11px 'Helvetica Neue',Arial,sans-serif}
    .c{fill:var(--faint);font:400 10px 'Helvetica Neue',Arial,sans-serif}
    .lb{fill:var(--accent);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .lw{fill:var(--warn);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .lo{fill:var(--ok);font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
    .ar{stroke:var(--line);stroke-width:1.5;fill:none}
    .rule{stroke:var(--line);stroke-width:1}
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker></defs>
  <text class="t" x="16" y="24">Service split: move recommendation work off the main server</text>
  <line class="rule" x1="16" y1="40" x2="864" y2="40"/>

  <rect class="box" x="16" y="106" width="120" height="56" rx="8"/>
  <text class="t" x="76" y="130" text-anchor="middle">Client</text>
  <text class="s" x="76" y="147" text-anchor="middle">Web</text>

  <path class="ar" d="M136 134 H180" marker-end="url(#a)"/>

  <rect class="acc" x="184" y="86" width="196" height="96" rx="8"/>
  <text class="lb" x="282" y="110" text-anchor="middle">MAIN</text>
  <text class="t" x="282" y="130" text-anchor="middle">Java · Spring</text>
  <text class="s" x="282" y="148" text-anchor="middle">Groups · real-time chat</text>
  <text class="s" x="282" y="164" text-anchor="middle">Community · auth</text>

  <path class="ar" d="M380 134 H444" marker-end="url(#a)"/>
  <text class="c" x="412" y="126" text-anchor="middle">Recommend</text>

  <rect class="box" x="448" y="86" width="196" height="96" rx="8"/>
  <text class="lb" x="546" y="110" text-anchor="middle">RECOMMEND</text>
  <text class="t" x="546" y="130" text-anchor="middle">Python · Flask</text>
  <text class="s" x="546" y="148" text-anchor="middle">Cosine similarity</text>
  <text class="s" x="546" y="164" text-anchor="middle">Region · MBTI · interests</text>

  <path class="ar" d="M448 158 H380" marker-end="url(#a)"/>

  <rect class="box" x="680" y="106" width="184" height="56" rx="8"/>
  <text class="t" x="772" y="130" text-anchor="middle">Docker</text>
  <text class="s" x="772" y="147" text-anchor="middle">Oracle Cloud</text>
  <path class="ar" d="M644 134 H676" marker-end="url(#a)"/>

  <text class="c" x="16" y="248">Led a five-person team. Split into two servers so recommendations never block main-server responses</text>
  <text class="c" x="16" y="266">2024</text>
</svg>
