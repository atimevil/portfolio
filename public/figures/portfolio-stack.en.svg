<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Portfolio site deployment: Nginx terminates HTTPS and passes requests to the Next.js app, which uses Postgres and a content volume. Everything runs in Docker on a self-hosted server.">
  <style>

    
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .acc{fill:var(--soft);stroke:var(--accent);stroke-width:1}
    .dash{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
    .t{fill:var(--ink);font:600 13px "Helvetica Neue",Arial,sans-serif}
    .s{fill:var(--dim);font:400 11px "Helvetica Neue",Arial,sans-serif}
    .c{fill:var(--faint);font:400 10px "Helvetica Neue",Arial,sans-serif}
    .lb{fill:var(--accent);font:600 10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
    .ar{stroke:var(--line);stroke-width:1.5;fill:none}
    .rule{stroke:var(--line);stroke-width:1}
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker></defs>
  <text class="t" x="16" y="24">Self-hosted stack: from HTTPS termination to the content volume</text>
  <line class="rule" x1="16" y1="40" x2="864" y2="40"/>

  <rect class="dash" x="16" y="58" width="848" height="172" rx="10"/>
  <text class="lb" x="32" y="80">DOCKER COMPOSE</text>

  <rect class="box" x="36" y="96" width="150" height="56" rx="8"/>
  <text class="t" x="111" y="120" text-anchor="middle">Nginx</text>
  <text class="s" x="111" y="137" text-anchor="middle">HTTPS termination · proxy</text>

  <path class="ar" d="M186 124 H226" marker-end="url(#a)"/>

  <rect class="acc" x="230" y="86" width="210" height="76" rx="8"/>
  <text class="lb" x="335" y="108" text-anchor="middle">APP</text>
  <text class="t" x="335" y="128" text-anchor="middle">Next.js · TypeScript</text>
  <text class="s" x="335" y="146" text-anchor="middle">App Router · Tailwind</text>

  <path class="ar" d="M440 110 H486" marker-end="url(#a)"/>
  <path class="ar" d="M440 140 H486" marker-end="url(#a)"/>

  <rect class="box" x="490" y="86" width="164" height="40" rx="8"/>
  <text class="s" x="572" y="111" text-anchor="middle">Postgres · Prisma</text>

  <rect class="box" x="490" y="132" width="164" height="40" rx="8"/>
  <text class="s" x="572" y="157" text-anchor="middle">Content volume · uploads</text>

  <rect class="box" x="682" y="96" width="160" height="56" rx="8"/>
  <text class="t" x="762" y="120" text-anchor="middle">Admin CMS</text>
  <text class="s" x="762" y="137" text-anchor="middle">Posts · history · settings</text>
  <path class="ar" d="M762 152 V186 H335 V166" marker-end="url(#a)"/>

  <text class="c" x="36" y="214">GitHub Actions: lint · typecheck · test · build → SSH deploy → smoke test</text>
  <text class="c" x="16" y="256">2026~ · the site you are looking at</text>
</svg>
