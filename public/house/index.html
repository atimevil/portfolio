<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f4f6fb;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a6ef5,#0d4fc9);color:white;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 2px 12px rgba(26,110,245,.3)}
.logo{background:white;color:#1a6ef5;font-weight:900;font-size:16px;width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-info h1{font-size:16px;font-weight:700}
.header-info p{font-size:11px;opacity:.85;margin-top:2px}
.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.body{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:340px;min-width:300px;background:white;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.07);z-index:10;overflow:hidden}
.sidebar-top{padding:12px;border-bottom:1px solid #eef0f5}
.search-wrap{display:flex;gap:6px;margin-bottom:10px}
.search-wrap input{flex:1;border:1.5px solid #e0e4ef;border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
.search-wrap input:focus{border-color:#1a6ef5}
.search-wrap button{background:#1a6ef5;color:white;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.filter-row:empty{display:none}
.crumb{font-size:14px;margin-bottom:8px;color:#888}
.crumb a{color:#1a6ef5;font-weight:700;text-decoration:none}
.crumb strong{color:#1a2340}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.rcard{border:1.5px solid #e0e4ef;border-radius:10px;padding:10px 12px;background:white;cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column;gap:3px;min-height:64px}
.rcard:hover,.rcard:focus-visible{border-color:#1a6ef5;background:#f4f8ff}
.rcard b{font-size:15px;color:#1a2340}
.rcard small{font-size:12px;color:#555}
.rbubble{border-radius:50%;background:#1a6ef5;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 3px 10px rgba(0,0,0,.25);line-height:1.15;cursor:pointer}
.rbubble b{font-size:13px}
.rbubble span{font-size:11px}
.fbtn{border:1.5px solid #e0e4ef;background:white;border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;color:#444;font-weight:500;transition:all .15s}
.fbtn.on{background:#1a6ef5;border-color:#1a6ef5;color:white}
.fbtn:hover:not(.on){border-color:#1a6ef5;color:#1a6ef5}
.stats{display:flex;gap:0;padding:8px 12px;background:#f8faff;border-bottom:1px solid #eef0f5}
.stat{flex:1;text-align:center;border-right:1px solid #eef0f5}
.stat:last-child{border-right:none}
.stat-n{font-size:18px;font-weight:800;color:#1a6ef5}
.stat-l{font-size:10px;color:#888;margin-top:1px}
.list-hdr{padding:8px 14px 5px;font-size:11px;color:#888;border-bottom:1px solid #f0f2f7}
.list{flex:1;overflow-y:auto}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:#d0d5e8;border-radius:2px}
.card{padding:11px 14px;border-bottom:1px solid #f0f2f7;cursor:pointer;transition:background .12s}
.card:hover{background:#f4f8ff}
.card.active{background:#eef3ff;border-left:3px solid #1a6ef5}
.card-top{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px}
.gu-tag{color:white;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0}
.card-name{font-size:12px;font-weight:700;color:#1a2340;line-height:1.35}
.card-addr{font-size:10px;color:#888;margin-bottom:6px;line-height:1.4}
.card-meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.tag{border-radius:4px;padding:2px 7px;font-size:10px;font-weight:500}
.tag-blue{background:#f0f4ff;color:#4a6fdc}
.tag-green{background:#f0fff4;color:#2d7a4a}
.tag-pink{background:#fff0f6;color:#d45f8a}
.tag-st{color:white;font-weight:700}
.popup-link{display:block;margin-top:9px;text-align:center;background:#1a6ef5;color:white!important;border-radius:7px;padding:7px;font-size:11px;font-weight:700;text-decoration:none}
.card-rent{font-size:10px;color:#555}
.card-rent b{color:#1a6ef5}
/* Map */
#map{flex:1;z-index:1;position:relative}
.mapmsg{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;background:rgba(26,35,64,.85);color:white;font-size:12px;border-radius:14px;padding:5px 12px;pointer-events:none;white-space:nowrap}
.mapmsg:empty{display:none}
.mapnote{position:absolute;left:10px;right:10px;bottom:28px;z-index:3;background:#fffbea;border:1px solid #fcd34d;color:#78350f;font-size:12px;line-height:1.5;border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.maperr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;color:#555;background:#eef1f7;line-height:1.6}
/* 팝업(카카오 CustomOverlay) */
.kpop{position:relative;white-space:normal;background:white;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);width:280px;max-width:calc(100vw - 40px);overflow:auto}
.kpop-x{position:absolute;top:6px;right:8px;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:#888;padding:4px}
.pin{cursor:pointer}
.pin:focus-visible{outline:3px solid #1a6ef5;outline-offset:2px;border-radius:8px}
.popup-box{padding:16px}
.popup-gu{display:inline-block;color:white;font-size:10px;font-weight:700;border-radius:4px;padding:2px 7px;margin-bottom:7px}
.popup-name{font-size:14px;font-weight:800;color:#1a2340;margin-bottom:3px}
.popup-addr{font-size:10px;color:#888;margin-bottom:10px;line-height:1.4}
.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pg{background:#f8faff;border-radius:7px;padding:7px 10px;text-align:center}
.pg-n{font-size:15px;font-weight:800;color:#1a6ef5}
.pg-l{font-size:9px;color:#888;margin-top:1px}
.popup-rent{border-top:1px solid #eef0f5;padding-top:8px}
.pr-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
.pr-row span:first-child{color:#888;white-space:nowrap;margin-right:10px}
.pr-row span:last-child{color:#1a2340;font-weight:600;text-align:right}
@media(max-width:700px){
  /* 휴대폰: 헤더 → 지도 → 목록 순서로 쌓고 페이지 전체를 스크롤 (목록이 좁은 칸에 갇히지 않게) */
  body{height:auto}
  .header{padding:10px 14px}
  .header-info p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #hdrTotal{display:none}
  .body{flex-direction:column;overflow:visible}
  #map{flex:none;height:45vh;order:-1}
  .sidebar{width:100%;height:auto;min-width:unset;overflow:visible;box-shadow:none}
  .list{overflow:visible}
  .filter-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .fbtn{flex-shrink:0;min-height:36px}
  .stats{display:none}
  .card.notice .card-addr,.card.notice .card-meta .tag-blue{display:none}
}
</style>

// ── 실시간 주소 찾기: 동시에 6건까지, 결과는 이 페이지를 연 동안만 기억
let active = 0;
const waiting = [];
function limited(fn) {
  return new Promise(res => {
    const run = () => { active++; fn().then(v => { active--; res(v); if (waiting.length) waiting.shift()(); }); };
    active < 6 ? run() : waiting.push(run);
  });
}
const spread = {};  // 같은 건물 좌표에 핀이 겹치면 작은 원으로 펼침
function locate(d) {
  if (d._loc !== undefined) return Promise.resolve(d._loc);
  if (!d._pending) d._pending = limited(() => new Promise(res => {
    const OK = kakao.maps.services.Status.OK;
    const done = (y, x) => {
      const k = (+y).toFixed(5) + ',' + (+x).toFixed(5), n = spread[k] = (spread[k] ?? -1) + 1;
      res(d._loc = LL(+y + 0.0004*Math.sin(n*2.4)*(n>0), +x + 0.0005*Math.cos(n*2.4)*(n>0)));
    };
    // 결과 없음만 '못 찾음'으로 기억하고, 일시 오류(쿼터·네트워크)는 다음에 다시 찾게 둔다
    const fail = st => { if (st !== kakao.maps.services.Status.ZERO_RESULT) d._pending = null; else d._loc = null; res(null); };
    // 이름으로 찾을 땐 그 시군구 안의 결과만 받는다 (같은 이름의 다른 동네 건물에 찍히지 않게)
    const gu = d.구.split(' ').pop();
    const byName = next => places.keywordSearch(d.검색명, (r, st) => {
      const hit = st === OK && r.find(x => x.address_name.includes(gu));
      hit ? done(hit.y, hit.x) : next(st === OK ? kakao.maps.services.Status.ZERO_RESULT : st);
    });
    const byAddr = next => geocoder.addressSearch(d.주소.split('(')[0].trim(), (r, st) => st === OK ? done(r[0].y, r[0].x) : next(st));
    // SH 행복주택은 주소가 없고 단지명만 있어 이름 먼저(번지가 있으면 주소로 한 번 더)
    if (d.kw) byName(st => /\d/.test(d.주소) && st !== kakao.maps.services.Status.ERROR ? byAddr(fail) : fail(st));
    else byAddr(st => !d.검색명 || st === kakao.maps.services.Status.ERROR ? fail(st) : byName(fail));
  }));
  return d._pending;
}

function fit(latlngs) {
  if (!map || !latlngs.length) return;
  if (latlngs.length === 1) { map.setLevel(4); map.setCenter(latlngs[0]); return; }
  const b = new kakao.maps.LatLngBounds();
  latlngs.forEach(p => b.extend(p));
  map.setBounds(b, 40, 40, 40, 40);
  if (map.getLevel() < 4) map.setLevel(4);  // 너무 확대되지 않게
}

// 팝업 하나를 같이 씀 (카카오 CustomOverlay)
let popupOv = null;
function closePopup() { if (popupOv) popupOv.setMap(null); popupOv = null; }
function openPopup(d, i) {
  if (!map || !d._loc) return;
  const wrap = document.createElement('div');
  wrap.style.paddingBottom = d._popupOffset + 'px';  // 핀 머리 위에 뜨게
  wrap.innerHTML = `<div class="kpop">${popupHtml(d)}<button class="kpop-x" aria-label="닫기">×</button></div>`;
  const box = wrap.querySelector('.kpop');
  // 휴대폰 지도(화면의 45%)보다 팝업이 길면 위가 잘려서, 지도 높이에 맞추고 안에서 스크롤
  if (innerWidth <= 700) box.style.maxHeight = (mapEl.clientHeight - d._popupOffset - 25) + 'px';
  wrap.querySelector('.kpop-x').onclick = e => { e.stopPropagation(); closePopup(); };
  // 카카오맵은 mouseup 때 지도 'click'을 내는데, 그게 closePopup을 불러 링크의 click이 나기 전에 팝업이 사라졌다.
  // 팝업 안 마우스·터치·휠은 지도로 보내지 않는다(휠은 지도 확대 대신 팝업 스크롤)
  ['mousedown', 'mouseup', 'touchstart', 'touchend', 'click', 'dblclick', 'wheel']
    .forEach(t => wrap.addEventListener(t, e => e.stopPropagation()));
  closePopup();
  popupOv = new kakao.maps.CustomOverlay({position: d._loc, content: wrap, xAnchor: .5, yAnchor: 1, zIndex: 10});
  popupOv.setMap(map);
  // 팝업이 지도 밖으로 삐져나가면 그만큼 지도 중심을 옮긴다 (핀은 지도 안에 남는 만큼만).
  // setMap 직후 바로 잰다 — 다음 프레임을 기다리면 백그라운드 탭에서 늦게 돌아 잠깐 잘려 보였다
  // 내리는 양은 핀이 지도 아래 끝에 닿을 때까지만(지도 위쪽 핀을 바로 눌렀을 때도 팝업이 다 보이게)
  const proj = map.getProjection(), pinY = proj.containerPointFromCoords(d._loc).y;
  const r = box.getBoundingClientRect(), m = mapEl.getBoundingClientRect();
  const dy = Math.min(Math.max(0, m.top + 10 - r.top), mapEl.clientHeight - 5 - pinY);
  const rm = innerWidth > 700 ? 50 : 10;  // 데스크톱은 오른쪽 확대·축소 버튼이 × 버튼을 덮지 않게
  const dx = r.left < m.left + 10 ? r.left - m.left - 10 : r.right > m.right - rm ? r.right - m.right + rm : 0;
  if (dx || dy > 0) {
    const c = proj.containerPointFromCoords(map.getCenter());
    map.setCenter(proj.coordsFromContainerPoint(new kakao.maps.Point(c.x + dx, c.y - Math.max(0, dy))));
  }
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card = document.getElementById('card-'+i);
  if(card){ card.classList.add('active'); if (innerWidth > 700) card.scrollIntoView({behavior:'smooth',block:'nearest'}); }  // 휴대폰에선 지도에 머무름
}

  const m = {};
  items.forEach(d => {
    const r = m[d.시도] ||= {sido:d.시도, n:0, units:0, open:0};
    r.n++; r.units += d.세대수||0; r.open += status(d)==='접수중';
  });
  const rank = s => { const k = SIDO_ORDER.indexOf(s); return k < 0 ? 99 : k; };
  return Object.values(m).map(r => ({...r, at: SIDO_AT[r.sido] || [36.4, 127.8]}))
    .sort((a,b) => rank(a.sido) - rank(b.sido));
}

function regionOverlay(r) {
  const s = Math.round(40 + Math.min(26, Math.sqrt(r.units)*1.2));
  const ring = r.open ? 'box-shadow:0 0 0 4px #16a34a,0 3px 10px rgba(0,0,0,.25)' : '';
  const el = document.createElement('div');
  el.className = 'rbubble pin';
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${r.sido} ${r.n}곳`);
  el.style.cssText = `width:${s}px;height:${s}px;${ring}`;
  el.innerHTML = `<b>${esc(r.sido)}</b><span>${r.n}곳</span>`;
  el.onclick = () => go(r.sido);
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') go(r.sido); };
  return new kakao.maps.CustomOverlay({position: LL(...r.at), content: el, xAnchor: .5, yAnchor: .5, zIndex: 3});
}

function renderCrumb() {
  const parts = [['전국', '']];
  if (currentSido!=='전국') parts.push([currentSido, encodeURIComponent(currentSido)]);
  if (currentGu!=='전체') parts.push([currentGu, '']);
  document.getElementById('crumb').innerHTML = parts.map(([label, href], k) => k === parts.length-1
    ? `<strong aria-current="page">${esc(label)}</strong>`
    : `<a href="#${href}">${esc(label)}</a>`).join(' <span aria-hidden="true">›</span> ');
}

function renderGuRow(base) {
  const row = document.getElementById('guRow');
  row.innerHTML = '';
  if (currentSido === '전국') return;
  const cnt = count(base.filter(d=>d.시도===currentSido), '구');
  [['전체', '전체'], ...Object.keys(cnt).sort().map(g => [`${g} ${cnt[g]}`, g])].forEach(([label, g]) => {
    const b = document.createElement('button');
    b.className = 'fbtn gu' + (g===currentGu ? ' on' : '');
    b.textContent = label;
    b.onclick = () => go(currentSido, g);
    row.appendChild(b);
  });
}

let token = 0;  // 지역을 바꾸면 이전 지역의 늦게 온 위치 결과는 버림
function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const base = DATA.filter(d => TYPES[currentType](d) &&
    (!q || d.주소.toLowerCase().includes(q) || d.주택군이름.toLowerCase().includes(q) || place(d).includes(q)));
  const scoped = base.filter(d => (currentSido==='전국' || d.시도===currentSido) && (currentGu==='전체' || d.구===currentGu));
  // 전국 첫 화면은 시도 요약, 검색하면 전국 결과를 바로 보여 줌. 고른 지역에 그 종류가 없으면 지도엔 있는 시도 거품
  const overview = (currentSido==='전국' && !q) || (!scoped.length && base.length);
  const regions = overview ? summarize(base) : null;
  renderCrumb();
  renderGuRow(base);
  renderList(scoped, currentSido==='전국' && !q ? regions : null, base);
  if (!map) return;

  const my = ++token;
  closePopup();
  regionOvs.forEach(o => o.setMap(null));
  DATA.forEach(d => d._ov && d._ov.setMap(null));
  if (overview) {
    regionOvs = regions.map(regionOverlay);
    regionOvs.forEach(o => o.setMap(map));
    fit(regions.map(r => LL(...r.at)));
    mapMsg.textContent = '';
    return;
  }
  regionOvs = [];
  if (currentSido !== '전국' && SIDO_AT[currentSido]) { map.setLevel(10); map.setCenter(LL(...SIDO_AT[currentSido])); }
  const want = scoped.slice(0, 300);  // 목록에 그리는 만큼만 찾음 (카카오 호출 수 = 쿼터)
  let done = 0, miss = 0;
  mapMsg.textContent = want.length ? `위치 찾는 중 0/${want.length}` : '';
  Promise.all(want.map(d => locate(d).then(pt => {
    if (my !== token) return;
    done++;
    if (pt) overlayOf(d).setMap(map); else miss++;
    if (done < want.length) mapMsg.textContent = `위치 찾는 중 ${done}/${want.length}`;
  }))).then(() => {
    if (my !== token) return;
    fit(want.filter(d => d._loc).map(d => d._loc));
    mapMsg.textContent = miss ? `지도에 못 찍은 곳 ${miss}곳 (목록에는 있음)` : '';
    if (miss) setTimeout(() => { if (my === token) mapMsg.textContent = ''; }, 5000);
  });
}

// ──────────────────────────────────────────────
// 리스트 렌더링
// ──────────────────────────────────────────────
// LH 청년 전세임대: 집 목록이 없어 핀 대신 목록 맨 위 카드로
function jeonseCard() {
  const j = META.jeonse;
  if (!j || !['전체','접수중·예정'].includes(currentType) || (currentType!=='전체' && status(j)==='마감')) return null;
  const div = document.createElement('div');
  div.className = 'card notice';
  div.style.cssText = 'background:#fffbea;cursor:default';
  div.innerHTML = `
    <div class="card-top"><span class="gu-tag" style="background:#b45309">전국</span>
      <div class="card-name">LH 청년 전세임대 (집은 직접 구함)</div></div>
    <div class="card-addr">${esc(j.공고명)} · ${esc(j.자격)} 1순위(수급자·한부모 등)</div>
    <div class="card-meta">${stTag(j)}<span class="tag tag-blue">지원한도 ${esc(j.한도)}</span></div>
    <div class="card-rent">접수 <b>${mmdd(j.신청시작)}~${mmdd(j.신청종료)}</b> · 보증금 ${esc(j.보증금)} · 월세 ${esc(j.월임대료)}
      · <a href="${LH_LIST_URL}" target="_blank" rel="noopener">LH청약플러스</a></div>`;
  return div;
}

function renderList(items, regions, base) {
  const total = items.reduce((s,d)=>s+(d.세대수||0),0);
  document.getElementById('listHdr').textContent = regions
    ? `전국 ${regions.length}개 시도 · ${items.length}곳 · ${total}세대 — 지역을 고르세요`
    : `${items.length}곳 · ${total}세대`;
  document.getElementById('sTotal').textContent = total.toLocaleString();
  document.getElementById('sBuildings').textContent = items.length;
  document.getElementById('sGu').textContent = new Set(items.map(place)).size;

  const list = document.getElementById('list');
  list.innerHTML = '';
  // 공개 페이지라 비공식 정리임을 항상 보이게 (계약된 집은 다음 갱신 전까지 남아 있을 수 있음)
  list.insertAdjacentHTML('beforeend', `<div class="list-hdr" style="background:#f8faff;line-height:1.5">
    비공식 정리 페이지예요. 신청 전에 원문 공고를 꼭 확인하세요. 이미 계약된 집이 남아 있을 수 있어요.
    출처: <a href="${LH_LIST_URL}" target="_blank" rel="noopener">LH청약플러스</a> ·
    <a href="https://soco.seoul.go.kr/youth/bbs/BMSR00015/list.do?menuNo=400008" target="_blank" rel="noopener">서울시 청년안심주택</a> ·
    <a href="https://www.i-sh.co.kr/main/lay2/S1T222C294/sublink.do" target="_blank" rel="noopener">SH</a></div>`);
  const jc = jeonseCard();
  if (jc) list.appendChild(jc);
  // 지역을 고른 채로 종류를 바꿔 0곳이면, 그 종류가 있는 시도를 바로 고를 수 있게 보여 줌
  const elsewhere = !regions && !items.length && currentSido !== '전국' ? summarize(base) : [];
  if (regions || elsewhere.length) {
    if (elsewhere.length) list.insertAdjacentHTML('beforeend', `<div class="list-hdr" style="padding:16px 14px 6px;line-height:1.5">
      ${esc(currentGu==='전체' ? currentSido : currentGu)}에는 지금 ${esc(currentType==='전체' ? '' : currentType + ' ')}공고가 없어요.
      <br><b>있는 지역</b></div>`);
    const grid = document.createElement('div');
    grid.className = 'rgrid';
    (regions || elsewhere).forEach(r => {
      const b = document.createElement('button');
      b.className = 'rcard';
      b.innerHTML = `<b>${esc(r.sido)}</b><small>${r.n}곳 · ${r.units.toLocaleString()}세대</small>
        ${r.open ? `<span class="tag tag-st" style="background:${ST_COLOR['접수중']};align-self:flex-start">지금 접수 ${r.open}곳</span>` : ''}`;
      b.onclick = () => go(r.sido);
      grid.appendChild(b);
    });
    list.appendChild(grid);
    return;
  }
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'list-hdr';
    empty.style.cssText = 'padding:24px 14px;text-align:center;font-size:13px';
    empty.textContent = '이 조건에 맞는 곳이 없어요. 종류를 ‘전체’로 바꾸거나 다른 지역을 골라 보세요.';
    list.appendChild(empty);
  }
  // 카드를 한 번에 너무 많이 그리면 느려서 300개까지만 (지도 핀도 같은 300개 — 카카오 호출 수)
  items.slice(0, 300).forEach(d => {
    const i = DATA.indexOf(d);
    const color = colorOf(d);
    const div = document.createElement('div');
    div.className = 'card';
    div.id = 'card-'+i;
    const meta = d.src === 'soco'
      ? `${stTag(d)}<span class="tag tag-blue">${d.세대수 ? d.세대수+'세대' : '예비자 모집'}</span><span class="tag tag-green">청년안심 ${esc(d.유형)}</span>`
      : d.src === 'happy' || d.src === 'sh'
      ? `${stTag(d)}<span class="tag tag-blue">청년 신청 가능 ${d.세대수}세대</span><span class="tag tag-green">${d.src === 'sh' ? 'SH' : 'LH'} 행복주택</span><span class="tag tag-blue">${fmtArea(d.전용면적_min,d.전용면적_max)}</span>`
      : `${stTag(d)}<span class="tag tag-blue">${d.세대수}세대</span><span class="tag tag-green">${esc(d.주택유형)}</span>
         ${d.성별용도구분==='여성전용'?'<span class="tag tag-pink">여성전용</span>':''}<span class="tag tag-blue">${fmtArea(d.전용면적_min,d.전용면적_max)}</span>`;
    const bottom = d.src === 'soco'
      ? `청약 <b>${mmdd(d.신청시작)}${d.신청종료!==d.신청시작 ? '~'+mmdd(d.신청종료) : ''}</b> · 게시 ${mmdd(d.게시일)}`
      : (d.src === 'happy' && !d.월세_min)
      ? `임대료 <b>공고문 확인</b> · 접수 ${mmdd(d.신청시작)}~${mmdd(d.신청종료)}`
      : d.src !== 'lh'
      ? `${money(d, '보증금_min', '보증금_max')} · 월 <b>${range(d.월세_min, d.월세_max)}</b> · 접수 ${mmdd(d.신청시작)}~${mmdd(d.신청종료)}`
      : `1순위 보증금 <b>${range(d.보증금_1순위, d.보증금_1순위)}</b> · 월 <b>${range(d.월임대료_1순위_min, d.월임대료_1순위_max)}</b> · 접수 ${mmdd(d.신청시작)}~${mmdd(d.신청종료)}`;
    div.innerHTML = `
      <div class="card-top">
        <span class="gu-tag" style="background:${color}">${esc(place(d))}</span>
        <div class="card-name">${esc(d.주택군이름)}</div>
      </div>
      <div class="card-addr">${esc(d.주소)}</div>
      <div class="card-meta">${meta}</div>
      <div class="card-rent">${bottom}</div>`;
    div.onclick = () => {
      // 휴대폰에선 지도가 목록 위에 있어 맨 위로 바로 올린다(부드러운 스크롤은 지도를 다시 그리는 중에 가끔 멈췄다)
      if (innerWidth <= 700) scrollTo(0, 0);
      const my = token;  // 위치를 찾는 사이 지역·종류를 바꾸면 옛 핀을 다시 올리지 않음
      locate(d).then(pt => {
        if (!map || my !== token) return;
        if (!pt) { mapMsg.textContent = '이 주소는 지도에서 위치를 못 찾았어요'; setTimeout(() => mapMsg.textContent = '', 3000); return; }
        overlayOf(d).setMap(map);
        map.setLevel(4);
        map.setCenter(pt);
        openPopup(d, i);
      });
    };
    list.appendChild(div);
  });
  if (items.length > 300) {
    const more = document.createElement('div');
    more.className = 'list-hdr';
    more.textContent = `외 ${items.length-300}곳은 목록·지도에 다 못 그려요. 시도·지역을 고르거나 검색어를 좁혀 보세요`;
    list.appendChild(more);
  }
}

document.getElementById('hdrSub').textContent = META.sub;
document.getElementById('hdrOpen').textContent = `지금 접수 ${DATA.filter(d=>status(d)==='접수중').length}곳`;
document.getElementById('hdrTotal').textContent = `총 ${DATA.length}곳`;
if (META.warn && META.warn.length) {  // 빌드에서 빠진 공고·급감이 있으면 머리에 표시 (로그를 안 봐도 보이게)
  const w = document.createElement('span');
  w.className = 'badge';
  w.style.cssText = 'background:#b45309;border-color:#fcd34d';
  w.textContent = `⚠ 데이터 확인 필요 ${META.warn.length}`;
  w.title = META.warn.join('\n');
  document.querySelector('.badges').prepend(w);
}
readHash();
applyFilter();  // 목록은 지도가 없어도 먼저 보여 줌

// 추적 방지(Firefox 엄격 모드 등)·광고 차단이 카카오 지도 타일을 막으면 핀만 뜨고 바탕이 빈다.
// 타일 이미지가 하나도 안 불러와졌으면 이유를 알려 준다(타일 주소 버전과 무관하게 실제 화면의 이미지로 판단)
function checkTiles() {
  const tiles = [...mapEl.querySelectorAll('img')].filter(i => /\/tile\//.test(i.src));
  if (!tiles.length || tiles.some(i => i.complete && i.naturalWidth > 0) || mapEl.querySelector('.mapnote')) return;
  mapEl.insertAdjacentHTML('beforeend', `<div class="mapnote" role="status">브라우저의 추적 방지나 광고 차단이 카카오 지도 바탕을 막고 있어요.
    이 사이트에서만 꺼 주시면 지도가 보여요. 핀과 목록은 그대로 쓸 수 있어요.</div>`);
}
function mapFailed(why) {
  mapEl.insertAdjacentHTML('beforeend', `<div class="maperr">지도를 불러오지 못했어요.<br>${why}<br>목록은 그대로 볼 수 있어요.</div>`);
}
if (window.kakao && kakao.maps) {
  // http로 연 페이지(로컬 확인)면 SDK가 주소 검색도 http로 보내는데, 그 요청이 멈추는 환경이 있어 https로 고정
  // (services.js: PROTOCOL = SECURE || TUNNELING ? "https:" : "http:").
  // https 페이지에선 켜지 않는다: 켜면 지도 타일까지 ssl.kakaocdn.net 우회 주소로 받아 추적 차단·광고 차단에 막힘
  if (location.protocol === 'http:') kakao.maps.TUNNELING = true;
  kakao.maps.load(() => {
    try {
      map = new kakao.maps.Map(mapEl, {center: LL(36.4, 127.8), level: 13});
      // 휴대폰에선 확대 버튼이 팝업 닫기(×)를 가려서 빼고 두 손가락 확대만 씀
      if (innerWidth > 700) map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      geocoder = new kakao.maps.services.Geocoder();
      places = new kakao.maps.services.Places();
      kakao.maps.event.addListener(map, 'click', closePopup);
      addEventListener('resize', () => map.relayout());
      applyFilter();
      setTimeout(checkTiles, 6000);
    } catch (e) { mapFailed(esc(e.message)); }
  });
} else {
  mapFailed('카카오맵 스크립트를 받지 못했어요 (네트워크 문제이거나 카카오에 등록되지 않은 주소에서 열었을 때).');
}
</script>
